<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRT Motors</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root {
  --blue: #1a1aff;
  --green: #1D9E75;
  --green-light: #E1F5EE;
  --amber: #BA7517;
  --amber-light: #FAEEDA;
  --red: #A32D2D;
  --red-light: #FCEBEB;
  --gold: #FFD700;
  --bg: #f4f3f0;
  --card: #ffffff;
  --border: rgba(0,0,0,0.08);
  --border-strong: rgba(0,0,0,0.15);
  --text: #1a1a1a;
  --muted: #6b6b6b;
  --faint: #9a9a9a;
  --radius: 12px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
/* SHARED */
.header { background: var(--blue); padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.header-logo { color: #fff; font-weight: 600; font-size: 17px; letter-spacing: 0.5px; }
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: #4ade80; animation: pulse 2s infinite; display: inline-block; margin-right: 5px; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.4} }
.container { max-width: 1100px; margin: 0 auto; padding: 24px 20px; }
.container.wide { max-width: 1400px; }
.btn { padding: 8px 18px; border-radius: 8px; font-size: 13px; font-family: inherit; font-weight: 500; cursor: pointer; border: 1px solid var(--border-strong); background: var(--card); color: var(--text); transition: all 0.15s; }
.btn:hover { background: #f0f0f0; }
.btn-primary { background: var(--blue); color: #fff; border-color: var(--blue); }
.btn-primary:hover { background: #0000cc; }
.btn-header { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25); color: #fff; padding: 6px 14px; border-radius: 8px; font-size: 13px; font-family: inherit; cursor: pointer; display: flex; align-items: center; gap: 6px; }
.btn-header:hover { background: rgba(255,255,255,0.25); }
/* ADMIN DASHBOARD */
#admin-view { display: none; }
.stats-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 24px; }
.stat-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
.stat-card.blue { border-top: 3px solid var(--blue); }
.stat-card.green { border-top: 3px solid var(--green); }
.stat-card.amber { border-top: 3px solid var(--amber); }
.stat-card.gray { border-top: 3px solid #888; }
.stat-val { font-size: 28px; font-weight: 600; line-height: 1; }
.stat-lbl { font-size: 12px; color: var(--muted); margin-top: 4px; }
.toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.search-wrap { flex: 1; min-width: 200px; position: relative; }
.search-wrap input { width: 100%; padding: 8px 12px 8px 36px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); font-size: 13px; font-family: inherit; background: var(--card); }
.search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--faint); font-size: 15px; }
.filter-select { padding: 8px 12px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); font-size: 13px; font-family: inherit; background: var(--card); cursor: pointer; }
.tabs { display: flex; gap: 4px; margin-bottom: 16px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px; width: fit-content; }
.tab-btn { padding: 6px 16px; border-radius: 6px; border: none; background: transparent; font-size: 13px; font-family: inherit; color: var(--muted); cursor: pointer; }
.tab-btn.active { background: var(--blue); color: #fff; font-weight: 500; }
/* JOB CARDS */
.job-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; transition: all 0.15s; }
.job-card:hover { border-color: var(--border-strong); transform: translateY(-1px); }
.job-card.stage-new { background: #E8F8EE; border-color: #A8DDB8; }
.job-card.stage-new:hover { border-color: #5CB87A; }
.job-card.stage-progress { background: #FFF3E0; border-color: #FFB74D; }
.job-card.stage-progress:hover { border-color: #FF9800; }
.job-card.stage-invoiced { background: #E6F1FB; border-color: #90BEE8; }
.job-card.stage-invoiced:hover { border-color: #1a1aff; }
.job-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
.job-header.clickable { cursor: pointer; }
.reg-plate { background: var(--gold); color: #1a1a1a; font-family: 'DM Mono', monospace; font-weight: 500; font-size: 13px; padding: 4px 12px; border-radius: 6px; letter-spacing: 2px; white-space: nowrap; border: 2px solid rgba(0,0,0,0.1); }
.job-info { flex: 1; min-width: 0; }
.job-name { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.job-vehicle { font-size: 12px; color: var(--muted); margin-top: 2px; }
.job-addr { font-size: 11px; color: var(--faint); margin-top: 1px; }
.progress-track { display: flex; gap: 2px; height: 4px; border-radius: 2px; margin-bottom: 6px; }
.pip { flex: 1; height: 4px; border-radius: 2px; background: #e0dedd; }
.pip.done { background: var(--green); }
.pip.active { background: var(--blue); }
.pip.inv { background: #639922; }
.pip.comp { background: #888; }
.progress-label { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; margin-bottom: 8px; }
.job-footer { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.job-refs { font-size: 11px; color: var(--muted); flex: 1; font-family: 'DM Mono', monospace; }
.stage-select { font-size: 12px; padding: 5px 8px; border: 1px solid var(--border-strong); border-radius: 6px; font-family: inherit; background: var(--card); cursor: pointer; max-width: 220px; }
.btn-icon { background: none; border: 1px solid var(--border-strong); border-radius: 6px; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--muted); font-size: 16px; }
.btn-icon:hover { border-color: var(--red); color: var(--red); background: var(--red-light); }
.btn-link { background: none; border: 1px solid var(--border-strong); border-radius: 6px; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--muted); font-size: 14px; text-decoration: none; }
.btn-link:hover { border-color: var(--blue); color: var(--blue); }
.notes-area { width: 100%; font-size: 12px; font-family: inherit; border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; resize: none; background: var(--bg); color: var(--text); margin-top: 8px; min-height: 36px; transition: border-color 0.15s; }
.notes-area:focus { outline: none; border-color: var(--blue); background: var(--card); }
.notes-area::placeholder { color: var(--faint); }
.notes-saved { font-size: 10px; color: var(--green); margin-top: 2px; display: none; }
.damage-section { margin-top: 8px; }
.damage-toggle { background: none; border: 1px solid var(--border-strong); border-radius: 6px; padding: 5px 10px; font-size: 11px; font-family: inherit; cursor: pointer; color: var(--muted); width: 100%; text-align: left; display: flex; align-items: center; justify-content: space-between; }
.damage-toggle:hover { border-color: var(--blue); color: var(--blue); }
.damage-toggle.has-damage { background: #FFF8E6; border-color: #F0C040; color: #7A5200; }
.damage-body { display: none; background: #FFF8E6; border: 1px solid #F0C040; border-radius: 6px; padding: 10px 12px; margin-top: 4px; font-size: 12px; color: #5a3e00; line-height: 1.5; }
.damage-body.open { display: block; }
/* JOB DETAIL MODAL */
.detail-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 300; align-items: flex-end; justify-content: center; padding: 0; }
.detail-overlay.open { display: flex; }
.detail-sheet { background: var(--card); border-radius: 20px 20px 0 0; width: 100%; max-width: 640px; max-height: 92vh; overflow-y: auto; padding: 20px 20px 32px; }
.detail-handle { width: 40px; height: 4px; background: var(--border-strong); border-radius: 2px; margin: 0 auto 16px; }
.detail-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
.detail-reg { font-family: 'DM Mono', monospace; font-size: 18px; font-weight: 500; background: var(--gold); color: #1a1a1a; padding: 6px 14px; border-radius: 8px; border: 2px solid rgba(0,0,0,0.1); letter-spacing: 2px; }
.detail-info { flex: 1; }
.detail-name { font-size: 16px; font-weight: 600; }
.detail-vehicle { font-size: 13px; color: var(--muted); margin-top: 2px; }
.detail-addr { font-size: 12px; color: var(--faint); margin-top: 2px; }
.detail-stage-label { font-size: 13px; font-weight: 600; color: var(--blue); margin-bottom: 4px; }
.detail-pct { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
.detail-progress { display: flex; gap: 2px; height: 5px; border-radius: 3px; margin-bottom: 12px; }
.detail-pip { flex: 1; height: 5px; border-radius: 3px; background: #e0dedd; }
.detail-pip.done { background: var(--green); }
.detail-pip.active { background: var(--blue); }
.detail-pip.inv { background: #639922; }
.detail-pip.comp { background: #888; }
.kv-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.chip { font-size: 11px; padding: 3px 10px; border-radius: 20px; background: var(--bg); border: 1px solid var(--border); color: var(--muted); }
.chip strong { color: var(--text); }
.dtabs { display: flex; gap: 4px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px; margin-bottom: 14px; overflow-x: auto; }
.dtab { padding: 6px 10px; border-radius: 6px; border: none; background: transparent; font-size: 12px; font-family: inherit; color: var(--muted); cursor: pointer; white-space: nowrap; flex: 1; }
.dtab.active { background: var(--blue); color: #fff; font-weight: 500; }
.detail-stage-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.detail-stage-item:last-child { border-bottom: none; }
.detail-dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border-strong); display: flex; align-items: center; justify-content: center; font-size: 11px; flex-shrink: 0; }
.detail-dot.done { background: var(--green); border-color: var(--green); color: #fff; }
.detail-dot.active { background: var(--blue); border-color: var(--blue); color: #fff; }
.detail-stage-text { font-size: 13px; flex: 1; }
.detail-stage-text.pending { color: var(--faint); }
.detail-stage-text.active { font-weight: 600; color: var(--blue); }
.stage-date { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; white-space: nowrap; }
.in-prog { font-size: 10px; background: #E6F1FB; color: var(--blue); padding: 1px 6px; border-radius: 10px; font-weight: 600; margin-left: 6px; }
.detail-refs { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; background: var(--bg); border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; }
.detail-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.detail-select { flex: 1; font-size: 13px; padding: 8px 10px; border: 1px solid var(--border-strong); border-radius: 8px; font-family: inherit; background: var(--card); }
.detail-close { background: none; border: 1px solid var(--border-strong); border-radius: 8px; padding: 8px 14px; font-size: 13px; font-family: inherit; cursor: pointer; color: var(--muted); }
.detail-del { background: none; border: 1px solid var(--red); border-radius: 8px; padding: 8px 14px; font-size: 13px; font-family: inherit; cursor: pointer; color: var(--red); }
.section-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--faint); margin: 14px 0 6px; }
.note-item { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; font-size: 13px; display: flex; gap: 10px; align-items: flex-start; }
.note-body { flex: 1; white-space: pre-wrap; line-height: 1.45; }
.note-time { font-size: 10px; color: var(--faint); font-family: 'DM Mono', monospace; margin-top: 3px; }
.note-del { background: none; border: none; color: var(--faint); cursor: pointer; font-size: 13px; padding: 2px; }
.note-del:hover { color: var(--red); }
.add-note-row { display: flex; gap: 8px; margin-bottom: 12px; align-items: flex-end; }
.add-note-row textarea { flex: 1; font-size: 13px; font-family: inherit; padding: 8px 10px; border: 1px solid var(--border-strong); border-radius: 8px; resize: vertical; min-height: 44px; background: var(--card); }
.add-note-row textarea:focus { outline: none; border-color: var(--blue); }
.part-row { display: flex; gap: 8px; align-items: center; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin-bottom: 6px; font-size: 13px; flex-wrap: wrap; }
.part-desc { flex: 1; min-width: 120px; }
.part-cost { font-family: 'DM Mono', monospace; font-size: 12px; white-space: nowrap; }
.part-dates { font-size: 10px; color: var(--faint); font-family: 'DM Mono', monospace; width: 100%; }
.part-status { font-size: 11px; padding: 4px 6px; border: 1px solid var(--border-strong); border-radius: 6px; font-family: inherit; background: var(--card); cursor: pointer; }
.add-part-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.add-part-row input { font-size: 13px; font-family: inherit; padding: 8px 10px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--card); }
.add-part-row input:focus { outline: none; border-color: var(--blue); }
.parts-total { text-align: right; font-size: 13px; font-weight: 600; margin-top: 8px; }
.photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; margin-top: 10px; }
.photo-thumb { position: relative; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-strong); aspect-ratio: 4/3; background: var(--bg); }
.photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-del { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.55); color: #fff; border: none; border-radius: 6px; width: 22px; height: 22px; cursor: pointer; font-size: 12px; line-height: 1; }
.photo-del:hover { background: var(--red); }
.upload-btn { display: inline-flex; align-items: center; gap: 6px; }
.hint-box { background: var(--amber-light); border: 1px solid #E8C48A; color: var(--amber); border-radius: 8px; padding: 10px 12px; font-size: 12px; line-height: 1.5; }
.dmg-edit { width: 100%; font-size: 13px; font-family: inherit; padding: 10px 12px; border: 1px solid #F0C040; background: #FFF8E6; color: #5a3e00; border-radius: 8px; resize: vertical; min-height: 110px; line-height: 1.5; }
.dmg-edit:focus { outline: none; border-color: var(--amber); }
.ready-banner { background: var(--green-light); border: 1px solid #5CB87A; color: #0F6E56; border-radius: 8px; padding: 10px 12px; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.notready-banner { background: var(--bg); border: 1px solid var(--border-strong); color: var(--muted); border-radius: 8px; padding: 10px 12px; font-size: 12px; margin-bottom: 4px; }
.tag { font-size: 10px; padding: 2px 7px; border-radius: 20px; font-weight: 600; }
.tag-auth { background: #E6F1FB; color: #0C447C; }
.tag-inv { background: var(--green-light); color: #0F6E56; }
.tag-no-auth { background: var(--amber-light); color: var(--amber); }
.tag-supp { background: #F0E6FB; color: #5B2D87; }
.tag-week { background: #EDEBFF; color: #3B2DA3; }
.tag-est { background: var(--green-light); color: #0F6E56; }
.tag-money { background: #16324F; color: #fff; font-family: 'DM Mono', monospace; }
.cal-total { font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 600; color: #16324F; margin-top: 3px; }
.week-totals { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.wt-item { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 14px; flex: 1; min-width: 105px; }
.wt-item.wt-grand { border: 1.5px solid var(--blue); background: #EDEBFF; }
.wt-val { font-size: 15px; font-weight: 600; font-family: 'DM Mono', monospace; white-space: nowrap; }
.wt-lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }
.days-pill { font-size: 11px; padding: 2px 8px; border-radius: 20px; white-space: nowrap; }
.days-ok { background: var(--green-light); color: #0F6E56; }
.days-warn { background: var(--amber-light); color: var(--amber); }
.days-over { background: var(--red-light); color: var(--red); }
.log-section { margin-top: 24px; }
.log-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--faint); margin-bottom: 8px; }
.log-box { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; max-height: 260px; overflow-y: auto; }
.log-entry { display: flex; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--border); font-size: 12px; align-items: baseline; }
.log-entry:last-child { border-bottom: none; }
.log-time { color: var(--faint); font-family: 'DM Mono', monospace; font-size: 11px; white-space: nowrap; }
.log-auto { background: #E6F1FB; color: var(--blue); font-size: 10px; padding: 1px 6px; border-radius: 4px; font-weight: 600; white-space: nowrap; }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.open { display: flex; }
.modal { background: var(--card); border-radius: var(--radius); padding: 24px; width: 100%; max-width: 440px; }
.modal-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
.form-row { margin-bottom: 12px; }
.form-row label { font-size: 12px; font-weight: 500; color: var(--muted); display: block; margin-bottom: 4px; }
.form-row input, .form-row select { width: 100%; padding: 8px 12px; border: 1px solid var(--border-strong); border-radius: 6px; font-size: 13px; font-family: inherit; background: var(--card); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
.loading { text-align: center; padding: 3rem; color: var(--muted); font-size: 14px; }
/* GARY'S PORTAL */
#gary-view { display: none; }
.gary-count { font-size: 11px; background: rgba(0,0,0,0.08); border-radius: 20px; padding: 1px 8px; margin-left: 4px; }
.tab-btn.active .gary-count { background: rgba(255,255,255,0.25); }
/* WEEK / REPAIR SCHEDULE CALENDAR */
#week-view { display: none; }
.week-nav { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
.week-nav-label { flex: 1; text-align: center; font-size: 15px; font-weight: 600; min-width: 180px; }
.week-nav-label .wk-badge { font-size: 11px; font-weight: 600; background: #EDEBFF; color: #3B2DA3; border-radius: 20px; padding: 2px 10px; margin-left: 8px; vertical-align: middle; }
.week-intro { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
.cal-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; align-items: start; }
.cal-day { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; min-height: 180px; }
.cal-day.today { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(26,26,255,0.12); }
.cal-day-head { font-size: 12px; font-weight: 600; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: baseline; }
.cal-day-head .cal-date { color: var(--faint); font-weight: 400; font-size: 11px; font-family: 'DM Mono', monospace; }
.cal-day.today .cal-day-head { color: var(--blue); }
.cal-count { font-size: 10px; color: var(--faint); }
.cal-tile { border: 1.5px solid var(--border-strong); border-radius: 8px; padding: 8px; margin-bottom: 8px; cursor: pointer; transition: all 0.15s; background: var(--card); }
.cal-tile:hover { transform: translateY(-1px); box-shadow: 0 3px 8px rgba(0,0,0,0.12); border-color: var(--blue); }
.cal-tile.t-new { background: #E8F8EE; border-color: #A8DDB8; }
.cal-tile.t-prog { background: #FFF3E0; border-color: #FFB74D; }
.cal-tile.t-rep { background: #E6F1FB; border-color: #90BEE8; }
.cal-tile.t-inv { background: var(--green-light); border-color: #5CB87A; }
.cal-reg { display: inline-block; background: var(--gold); color: #1a1a1a; font-family: 'DM Mono', monospace; font-weight: 500; font-size: 11px; padding: 2px 8px; border-radius: 4px; letter-spacing: 1px; border: 1.5px solid rgba(0,0,0,0.1); margin-bottom: 4px; }
.cal-name { font-size: 11px; font-weight: 600; line-height: 1.3; }
.cal-vehicle { font-size: 10px; color: var(--muted); margin-top: 1px; }
.cal-stage { font-size: 10px; font-weight: 600; color: var(--blue); margin-top: 3px; display: flex; align-items: center; gap: 4px; }
.ready-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: inline-block; }

/* CUSTOMER TRACKER */

.tracker-wrap { max-width: 500px; margin: 0 auto; padding: 24px 20px; }

.tracker-vehicle-card { background: var(--card); border: 1px solid var(--border); border-top: none; padding: 16px 20px; margin-bottom: 20px; border-radius: 0 0 var(--radius) var(--radius); }

.rec-marker span { transform: rotate(45deg); }

@media (max-width: 1100px) { .rec-grid { grid-template-columns: repeat(2, 1fr); } .rec-day { min-height: 0; } }

<script>
// ─── CONFIG ──────────────────────────────────────────────
const SUPABASE_URL = 'https://kgohkilvxqjfadhyasyk.supabase.co';

const SITE_URL = window.location.origin;
const PHOTO_BUCKET = 'job-photos';
// ─── STAGES ("Estimated" is now a tick-box, not a stage) ─
const STAGES = [
  { label: 'New instruction',        sub: 'Job instruction received from ACG' },

const IN_REPAIR_STAGE = STAGES.findIndex(s => s.label === 'In repair');
const INVOICED_STAGE = STAGES.findIndex(s => s.label === 'Invoiced');
const COMPLETE_STAGE = STAGES.findIndex(s => s.label === 'Complete');
const LAST_STAGE = STAGES.length - 1;
const FLAG_LABELS = {
  is_estimated: 'Estimated',

  parts_on_backorder: 'Parts on back order',

// ─── DATE HELPERS ─────────────────────────────────────────
function isoLocal(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function todayISO() { return isoLocal(new Date()); }
function mondayISO(d) {
  const x = new Date(d);
  x.setHours(0, 0, 0, 0);
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return isoLocal(x);
}
function addDaysISO(iso, n) {
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return isoLocal(d);
}
function addWeeksISO(iso, n) { return addDaysISO(iso, 7 * n); }
function fmtShortISO(iso) {
  if (!iso) return '';
  const d = new Date(String(iso).slice(0, 10) + 'T00:00:00');
  if (isNaN(d)) return '';
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}
function fmtWeekISO(iso) {
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
}
function fmtDayName(iso) {
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-GB', { weekday: 'long' });
}
function fmtDT(ts) {
  const d = new Date(ts);
  const today = new Date();
  const time = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  if (d.toDateString() === today.toDateString()) return time;
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }) + ' ' + time;
}
function daysSince(d) {
  return Math.floor((Date.now() - new Date(d)) / 86400000);
}
function escHtml(s) {
  return (s == null ? '' : String(s))
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function escAttr(s) {
  return escHtml(s).replace(/"/g, '&quot;');
}
function readyToStart(j) {
  return !!(j.parts_ordered && j.parts_on_site && j.is_estimated && !j.parts_on_backorder && (!j.needs_supplementary || j.supplementary_sent));
}
function fmtGBP(n) {
  return '£' + Number(n).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
// ─── ADMIN ────────────────────────────────────────────────
async function showAdmin() {
  document.getElementById('loading-view').style.display = 'none';
  document.getElementById('admin-view').style.display = 'block';
  populateStageSelects();
  await refreshJobs();
  setInterval(refreshJobs, 30000);
}
// Skip auto-refresh redraws while the user is mid-task: a popup is open,
// they're typing in a field, or they've picked something from a dropdown.
function uiBusy() {
  const openModal = document.querySelector('.modal-overlay.open, .detail-overlay.open');
  if (openModal) return true;
  const a = document.activeElement;
  if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT')) return true;
  return false;
}
async function refreshJobs() {
  if (uiBusy()) return;   // don't yank the page out from under the user
  // remember previous state so we can auto-log changes made by the backend
  const prev = {};
  jobs.forEach(j => { prev[j.id] = { stage: j.stage, auth: !!j.auth_confirmed }; });
  const { data, error } = await db.from('jobs_with_supplementary').select('*').order('added_date', { ascending: false });
  if (error) { console.error(error); return; }
  jobs = data || [];
  // Merge schedule / checklist / history fields straight from the base table,
  // so they're always present even if the view doesn't expose them.
  const { data: extra, error: exErr } = await db.from('jobs')
    .select('id,repair_week,repair_week_start,repair_day,stage_dates,repair_grand_total,labour_cost,paint_cost,parts_cost,specialist_cost,sub_total,vat_total,parts_ordered,parts_on_site,parts_on_backorder,backorder_part,is_estimated,needs_supplementary,supplementary_sent');
  if (!exErr && extra) {
    const map = {};
    extra.forEach(e => { map[e.id] = e; });
    jobs = jobs.map(j => Object.assign({}, j, map[j.id] || {}));
  }
  // Auto-log any changes made elsewhere (backend, another device)
  jobs.forEach(j => {
    const p = prev[j.id];
    if (!p) return;
    if (p.stage !== j.stage) {
      logEvent(j, 'stage', 'Moved to "' + (STAGES[j.stage] ? STAGES[j.stage].label : j.stage) + '"', true);
      recordStageDate(j, j.stage);
    }
    if (!p.auth && j.auth_confirmed) logEvent(j, 'auth', 'Repair authorised', true);
  });
  renderJobs();
  if (document.getElementById('week-view').style.display === 'block') renderWeek();
  if (document.getElementById('gary-view').style.display === 'block') renderGary();
  if (document.getElementById('recovery-view').style.display === 'block') loadRecovery(true);
  if (detailJobId && document.getElementById('detail-modal').classList.contains('open')) renderDetail();
  loadEvents();
}
async function loadEvents() {
  const { data, error } = await db.from('job_events').select('*').order('created_at', { ascending: false }).limit(40);
  if (error) { historyOk = false; renderLog(); return; }
  historyOk = true;
  events = data || [];
  renderLog();
}
// Persist an event to the history table (and show it instantly)
async function logEvent(j, type, message, auto) {
  const row = {
    job_id: j && j.id ? j.id : null,
    reg: j ? (j.reg || null) : null,
    name: j ? (j.name || null) : null,
    event_type: type,
    message: message,
    auto: !!auto,
    created_at: new Date().toISOString()
  };
  events.unshift(row);
  renderLog();
  if (detailJobId && j && j.id === detailJobId) { detailEvents.unshift(row); }
  const { error } = await db.from('job_events').insert([{
    job_id: row.job_id, reg: row.reg, name: row.name,
    event_type: row.event_type, message: row.message, auto: row.auto
  }]);
  if (error) console.error('logEvent:', error.message);
}
// Record the date a stage was first reached (stored on the job as jsonb)
async function recordStageDate(j, stage) {
  const sd = Object.assign({}, j.stage_dates || {});
  if (sd[stage] != null) return;
  sd[stage] = todayISO();
  j.stage_dates = sd;
  await db.from('jobs').update({ stage_dates: sd }).eq('id', j.id);
}
function renderLog() {
  const el = document.getElementById('log-box');
  if (!el) return;
  if (!historyOk) {
    el.innerHTML = '<div class="log-entry"><span style="color:var(--muted)">History not set up yet — run <strong>supabase-migration.sql</strong> in the Supabase SQL editor to enable permanent date logging.</span></div>';
    return;
  }
  if (!events.length) {
    el.innerHTML = '<div class="log-entry"><span style="color:var(--muted)">No activity yet.</span></div>';
    return;
  }
  el.innerHTML = events.slice(0, 40).map(e => {
    const who = e.reg ? '<strong>' + escHtml(e.reg) + '</strong>' + (e.name ? ' — ' + escHtml(e.name) : '') + ': ' : '';
    return '<div class="log-entry">' +
      '<span class="log-time">' + fmtDT(e.created_at) + '</span>' +
      (e.auto ? '<span class="log-auto">AUTO</span>' : '') +
      '<span style="color:var(--muted)">' + who + escHtml(e.message) + '</span>' +
    '</div>';
  }).join('');
}
function pipClass(i, stage) {
  if (stage === COMPLETE_STAGE) return i <= COMPLETE_STAGE ? 'comp' : '';
  if (stage === INVOICED_STAGE) return i < INVOICED_STAGE ? 'done' : i === INVOICED_STAGE ? 'inv' : '';
  if (i < stage) return 'done';
  if (i === stage) return 'active';
  return '';
}
// ─── WEEK SCHEDULING HELPERS ─────────────────────────────
function weekOptionsFor(j) {
  const opts = [];
  const start = mondayISO(new Date());
  for (let i = 0; i < 8; i++) opts.push(addWeeksISO(start, i));
  if (j && j.repair_week_start && opts.indexOf(j.repair_week_start) === -1) {
    opts.unshift(j.repair_week_start);   // keep past/far-out weeks visible
  }
  return opts;
}
function weekLabel(w) {
  if (!w) return '⏱ Unscheduled';
  const t = mondayISO(new Date()), n = addWeeksISO(t, 1);
  const d = fmtWeekISO(w);
  if (w === t) return '📅 This week (' + d + ')';
  if (w === n) return '📆 Next week (' + d + ')';
  return '🗓 Wk of ' + d;
}
function weekSelectHTML(j) {
  const opts = weekOptionsFor(j).map(w =>
    '<option value="' + w + '"' + (j.repair_week_start === w ? ' selected' : '') + '>' + weekLabel(w) + '</option>'
  ).join('');
  return '<select class="week-select" onchange="setWeek(\'' + j.id + '\', this.value)" title="Allocate this job to a repair week">' +
    '<option value=""' + (!j.repair_week_start ? ' selected' : '') + '>⏱ Unscheduled</option>' + opts + '</select>';
}
async function setWeek(id, val) {
  const t = mondayISO(new Date()), n = addWeeksISO(t, 1);
  const legacy = val === t ? 'this' : val === n ? 'next' : null;   // keep old column in sync
  const j = jobs.find(x => x.id === id);
  // if the job moves to a different week, its booked day no longer applies
  const keepDay = j && j.repair_day && val && mondayISO(new Date(j.repair_day + 'T00:00:00')) === val;
  const upd = { repair_week_start: val || null, repair_week: legacy, updated_at: new Date().toISOString() };
  if (!keepDay) upd.repair_day = null;
  const { error } = await db.from('jobs').update(upd).eq('id', id);
  if (error) { alert('Error scheduling job: ' + error.message); return; }
  if (j) {
    j.repair_week_start = val || null;
    j.repair_week = legacy;
    if (!keepDay) j.repair_day = null;
    logEvent(j, 'schedule', val ? 'Scheduled for week commencing ' + fmtWeekISO(val) : 'Removed from repair schedule', false);
  }
  renderJobs();
  if (document.getElementById('week-view').style.display === 'block') renderWeek();
  if (detailJobId === id && document.getElementById('detail-modal').classList.contains('open')) renderDetail();
}
async function setDay(id, val) {
  if (val === '__remove') { setWeek(id, ''); return; }
  const j = jobs.find(x => x.id === id);
  const upd = { repair_day: val || null, updated_at: new Date().toISOString() };
  // booking a day also pins the week
  if (val) { upd.repair_week_start = mondayISO(new Date(val + 'T00:00:00')); }
  const { error } = await db.from('jobs').update(upd).eq('id', id);
  if (error) { alert('Error saving day: ' + error.message); return; }
  if (j) {
    j.repair_day = val || null;
    if (val) j.repair_week_start = upd.repair_week_start;
    logEvent(j, 'schedule', val ? 'Booked in for ' + fmtWeekISO(val) : 'Day cleared (still in week ' + fmtShortISO(j.repair_week_start) + ')', false);
  }
  renderJobs();
  renderWeek();
}
// ─── JOB LIST ─────────────────────────────────────────────

        <span class="reg-plate">${j.reg || '—'}</span>

          <div class="job-name">${escHtml(j.name) || '—'} ${tags.join('')}</div>
          <div class="job-vehicle">${escHtml(j.vehicle) || '—'}</div>
          <div class="job-addr">${j.mobile ? '📱 ' + escHtml(j.mobile) : 'No mobile'}</div>
          <div class="job-addr">${escHtml(j.address) || ''}</div>
        </div>
        <span class="days-pill ${dClass}">${days}d</span>
      </div>
      <div class="progress-track">${pips}</div>
      <div class="progress-label">
        <span><strong>${STAGES[j.stage]?.label || '—'}</strong></span>

function renderStats() {
  const inProg = jobs.filter(j => j.stage < INVOICED_STAGE).length;

  const comp = jobs.filter(j => j.stage === COMPLETE_STAGE).length;

async function updateStage(id, stage) {
  stage = parseInt(stage);
  const j = jobs.find(x => x.id === id);
  const sd = Object.assign({}, (j && j.stage_dates) || {});
  if (sd[stage] == null) sd[stage] = todayISO();
  const { error } = await db.from('jobs').update({ stage, stage_dates: sd, updated_at: new Date().toISOString() }).eq('id', id);
  if (error) { alert('Error updating stage: ' + error.message); return; }
  if (j) {
    j.stage = stage;
    j.stage_dates = sd;
    logEvent(j, 'stage', 'Moved to "' + (STAGES[stage] ? STAGES[stage].label : stage) + '"', false);
  }
  renderJobs();
  if (document.getElementById('week-view').style.display === 'block') renderWeek();
  if (document.getElementById('gary-view').style.display === 'block') renderGary();
}

async function removeJob(id, name, reg) {
  if (!confirm(`Remove ${name} (${reg}) from dashboard?\n\nThis should only be done when remittance has been received from ACG.`)) return;
  const j = jobs.find(x => x.id === id);
  if (j) await logEvent(j, 'removed', 'Removed from dashboard', false);   // event survives (job_id set null)
  const { error } = await db.from('jobs').delete().eq('id', id);
  if (error) { alert('Error removing job: ' + error.message); return; }
  jobs = jobs.filter(x => x.id !== id);
  if (detailJobId === id) document.getElementById('detail-modal').classList.remove('open');
  renderJobs();
  if (document.getElementById('week-view').style.display === 'block') renderWeek();
}
async function addJob() {
  const name = document.getElementById('f-name').value.trim();
  const reg = document.getElementById('f-reg').value.trim().toUpperCase();
  const vehicle = document.getElementById('f-vehicle').value.trim();
  const address = document.getElementById('f-addr').value.trim();
  const invoice_number = document.getElementById('f-inv').value.trim();
  const acg_ref = document.getElementById('f-ref').value.trim();
  const stage = parseInt(document.getElementById('f-stage').value);
  if (!name || !reg || !vehicle) { alert('Please fill in name, registration and vehicle.'); return; }
  const stage_dates = {}; stage_dates[stage] = todayISO();
  const { data, error } = await db.from('jobs').insert([{
    name, reg, vehicle, address, invoice_number, acg_ref, stage,
    auth_confirmed: stage >= IN_REPAIR_STAGE, added_date: todayISO(), stage_dates
  }]).select();
  if (error) { alert('Error adding job: ' + error.message); return; }
  const newJob = (data && data[0]) || { id: null, reg, name };
  logEvent(newJob, 'created', 'Job added manually — starting at "' + (STAGES[stage] ? STAGES[stage].label : stage) + '"', false);

async function setFlag(id, field, value) {

// — Timeline tab: every stage with the date it was reached + full event history —
function buildTimeline(j, sd) {
  const stageItems = STAGES.map((s, i) => {
    const done = i < j.stage || (j.stage === COMPLETE_STAGE && i <= COMPLETE_STAGE);
    const active = i === j.stage;
    const dotClass = done && !active ? 'done' : active ? 'active' : '';
    const textClass = done && !active ? '' : active ? 'active' : 'pending';
    const icon = done && !active ? '✓' : active ? '▶' : '';
    const dt = sd[i] ? fmtShortISO(sd[i]) : '';
    return `<div class="detail-stage-item">
      <div class="detail-dot ${dotClass}">${icon}</div>
      <span class="detail-stage-text ${textClass}">${s.label}${active ? '<span class="in-prog">In progress</span>' : ''}</span>
      <span class="stage-date">${dt}</span>
    </div>`;
  }).join('');
  let history;
  if (!historyOk) history = migrationHint();
  else if (!detailEvents.length) history = '<div style="font-size:12px;color:var(--muted);padding:8px 2px">No history recorded yet — every stage move, note, part and photo will be date-logged here from now on.</div>';
  else history = detailEvents.map(e => `
    <div class="log-entry">
      <span class="log-time">${fmtDT(e.created_at)}</span>
      ${e.auto ? '<span class="log-auto">AUTO</span>' : ''}
      <span style="color:var(--muted)">${escHtml(e.message)}</span>
    </div>`).join('');
  return `<div>${stageItems}</div>
    <div class="section-label">Full history</div>
    <div class="log-box">${history}</div>`;
}

async function uploadPhotos(input) {
  const files = Array.from(input.files || []);
  if (!files.length) return;
  const status = document.getElementById('upload-status');
  const j = jobs.find(x => x.id === detailJobId);
  let done = 0, failed = 0;
  for (const file of files) {
    if (status) status.textContent = `Uploading ${done + failed + 1}/${files.length}…`;
    const safe = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
    const pathName = detailJobId + '/' + Date.now() + '-' + safe;
    const { error } = await db.storage.from(PHOTO_BUCKET).upload(pathName, file, { cacheControl: '3600', upsert: false });
    if (error) { failed++; console.error(error); } else done++;
  }
  if (failed && status) status.textContent = `${done} uploaded, ${failed} failed (has the migration been run?)`;
  else if (status) status.textContent = '';
  if (done && j) logEvent(j, 'photo', done + ' photo' + (done > 1 ? 's' : '') + ' added', false);
  const ph = await db.storage.from(PHOTO_BUCKET).list(detailJobId, { limit: 100, sortBy: { column: 'created_at', order: 'desc' } });
  detailPhotos = (ph.data || []).filter(f => f.name !== '.emptyFolderPlaceholder');
  renderDetail();
}

async function showTracker(reg) {

  el.innerHTML = `

    </div>

      <div class="tracker-vehicle-name">${escHtml(job.vehicle) || 'Your vehicle'}</div>
      <div class="tracker-customer">${escHtml(job.name)}</div>

      <span style="font-size:20px">✅</span>
      <span class="complete-banner-text">Your vehicle is ready — we'll be in touch to arrange collection or delivery.</span>

      <span style="font-size:12px;margin-top:4px;display:block">Mon–Fri 8am–6pm · Sat 9am–1pm</span>

async function saveRecJob() {

  const custAddr = document.getElementById('r-cust-addr').value.trim();

    follows_id: document.getElementById('r-follows').value || null,
    updated_at: new Date().toISOString(),
  };

  if (row.follows_id && !row.driver_id) {
    const pred = recJobs.find(x => x.id === row.follows_id);

  }
  if (!row.scheduled_date) { alert('Please pick a date.'); return; }
  if (!custAddr) { alert('Please fill in the customer address.'); return; }
  // delivery: base → customer · collection: customer → base
  if (type === 'delivery') {
    row.pickup_address = baseLabel(base);
    row.dropoff_address = custAddr;
  } else {
    row.pickup_address = custAddr;
    row.dropoff_address = baseLabel(base);
  }
  const old = recEditId ? recJobs.find(x => x.id === recEditId) : null;
  // re-geocode any address that changed
  if (!old || old.pickup_address !== row.pickup_address) { row.pickup_lat = null; row.pickup_lng = null; }
  if (!old || old.dropoff_address !== row.dropoff_address) { row.dropoff_lat = null; row.dropoff_lng = null; }
  // bases have hard-wired coordinates — no geocoding needed for that side
  if (type === 'delivery') { row.pickup_lat = base.lat; row.pickup_lng = base.lng; }
  else { row.dropoff_lat = base.lat; row.dropoff_lng = base.lng; }

    return;
  }
  const rec = (saved && saved[0]) || null;
  const drv = driverById(row.driver_id);
  logEvent({ id: row.job_id, reg: row.reg, name: row.customer_name }, 'recovery',
    (recEditId ? 'Recovery updated: ' : 'Recovery booked: ') + recTypeLabel(row.job_type) + ' ' +
    shortAddr(row.pickup_address) + ' → ' + shortAddr(row.dropoff_address) + ' on ' + fmtWeekISO(row.scheduled_date) +
    (row.scheduled_time ? ' at ' + fmtRecTime(row.scheduled_time) : '') + (drv ? ' — ' + drv.name : ''), false);
  closeModal('rec-modal');

async function geocodeAddress(addr) {
  try {
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=gb&q=' + encodeURIComponent(addr);
    const res = await fetch(url, { headers: { 'Accept-Language': 'en-GB' } });
    if (!res.ok) return null;
    const data = await res.json();
    if (!data || !data.length) return null;
    return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
  } catch (e) { return null; }
}
async function geocodeRecJob(r) {

    const g = await geocodeAddress(r.pickup_address);
    if (g) { upd.pickup_lat = g.lat; upd.pickup_lng = g.lng; }
  }
  if (r.dropoff_address && (r.dropoff_lat == null || r.dropoff_lng == null)) {
    await new Promise(res => setTimeout(res, 1100));   // be polite to the free geocoder
    const g = await geocodeAddress(r.dropoff_address);
    if (g) { upd.dropoff_lat = g.lat; upd.dropoff_lng = g.lng; }
  }
  if (!Object.keys(upd).length) return;
  Object.assign(r, upd);
  await db.from('recovery_jobs').update(upd).eq('id', r.id);
  if (recTab === 'map') renderRecMap();

async function fetchRoute(fromLat, fromLng, toLat, toLng) {
  const key = [fromLng, fromLat, toLng, toLat].map(n => n.toFixed(5)).join(',');
  if (routeCache[key]) return routeCache[key];
  try {
    const url = `https://router.project-osrm.org/route/v1/driving/${fromLng},${fromLat};${toLng},${toLat}?overview=full&geometries=geojson`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('osrm ' + res.status);
    const data = await res.json();
    if (!data.routes || !data.routes.length) throw new Error('no route');
    const out = {
      coords: data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]),
      km: data.routes[0].distance / 1000,
      mins: data.routes[0].duration / 60,
    };
    routeCache[key] = out;
    return out;
  } catch (e) {
    // fall back to a straight line if the free router is busy
    const out = { coords: [[fromLat, fromLng], [toLat, toLng]], km: null, mins: null, straight: true };
    routeCache[key] = out;
    return out;
  }
}

// Order a driver's day: earliest first, but any job linked with "follows on
// from" slots in directly after its predecessor, however its time is set.
function orderDriverJobs(jobsArr) {
  const byId = {};
  jobsArr.forEach(j => { byId[j.id] = j; });
  const followers = {};
  jobsArr.forEach(j => {
    if (j.follows_id && byId[j.follows_id]) (followers[j.follows_id] = followers[j.follows_id] || []).push(j);
  });
  const byTime = (a, b) => String(a.scheduled_time || '99').localeCompare(String(b.scheduled_time || '99'));
  const roots = jobsArr.filter(j => !(j.follows_id && byId[j.follows_id])).sort(byTime);
  const out = [], seen = {};
  function add(j) {
    if (seen[j.id]) return;
    seen[j.id] = true;
    out.push(j);
    (followers[j.id] || []).sort(byTime).forEach(add);
  }
  roots.forEach(add);
  jobsArr.slice().sort(byTime).forEach(add);   // safety net for any loops
  return out;
}

        if (token !== recMapToken) return;
        const leg = L.polyline(rep.coords, linked
          ? { color, weight: 4, opacity: 0.8, dashArray: '10 6' }
          : { color, weight: 3, opacity: 0.4, dashArray: '3 9' }).addTo(recMap);
        if (linked) {
          leg.bindPopup(`<strong>Straight on</strong> — no return to base<br>${escHtml(shortAddr(prev.dropoff_address))} → ${escHtml(shortAddr(r.pickup_address))}${rep.km ? '<br>' + (rep.km * 0.621371).toFixed(0) + ' mi · ~' + Math.round(rep.mins) + ' min' : ''}`);
          rep.coords.forEach(c => allBounds.push(c));
        }
        recMapLayers.push(leg);
      }
      if (hasPickup && hasDrop) {
        const route = await fetchRoute(r.pickup_lat, r.pickup_lng, r.dropoff_lat, r.dropoff_lng);
        if (token !== recMapToken) return;
        const line = L.polyline(route.coords, { color, weight: 5, opacity: 0.85 }).addTo(recMap);
        line.bindPopup(`<strong>${escHtml(g.driver ? g.driver.name : 'Unallocated')}</strong> — ${recTypeLabel(r.job_type)}<br>${escHtml(shortAddr(r.pickup_address))} → ${escHtml(shortAddr(r.dropoff_address))}${route.km ? '<br>' + route.km.toFixed(0) + ' km · ~' + Math.round(route.mins) + ' min' : ''}`);
        recMapLayers.push(line);
        route.coords.forEach(c => allBounds.push(c));
        if (route.km != null) legInfo = ` · ${(route.km * 0.621371).toFixed(0)} mi, ~${Math.round(route.mins)} min`;
      }
      // Only customer addresses get numbers — bases just get one 🏠 pin each.
      const placeStop = (lat, lng, addr, kind) => {
        const b = baseFromAddress(addr);
        if (b) {
          if (!basesPlaced[b.key]) {
            basesPlaced[b.key] = true;
            const m = L.marker([lat, lng], { icon: baseMarkerIcon(), zIndexOffset: -100 }).addTo(recMap);
            m.bindPopup(`<strong>${escHtml(b.name)}</strong><br>${escHtml(b.addr)}`);
            recMapLayers.push(m);
          }
          allBounds.push([lat, lng]);
          return;
        }
        stopNo++;
        const m = L.marker([lat, lng], { icon: recMarkerIcon(color, stopNo) }).addTo(recMap);
        m.bindPopup(`<strong>Stop ${stopNo} — ${kind}</strong> (${recTypeLabel(r.job_type)})<br>${escHtml(addr || '')}${r.reg ? '<br>Reg: ' + escHtml(r.reg) : ''}${r.scheduled_time ? '<br>' + fmtRecTime(r.scheduled_time) : ''}`);
        recMapLayers.push(m);
        allBounds.push([lat, lng]);
      };
      if (hasPickup) placeStop(r.pickup_lat, r.pickup_lng, r.pickup_address, 'pick up');
      if (hasDrop) placeStop(r.dropoff_lat, r.dropoff_lng, r.dropoff_address, 'drop off');
      const warn = (!hasPickup || !hasDrop) ? ` <span class="map-warn">⚠ address not located yet</span>` : '';
      const linkNote = linked ? `<div style="font-size:10px;color:var(--muted);padding-left:20px">↳ straight on from ${escHtml(prev.reg || shortAddr(prev.dropoff_address))} — no return to base</div>` : '';
      legsHtml += linkNote + `<div class="map-leg" onclick="focusRecLeg('${r.id}')"><span class="leg-no" style="border-color:${color};color:${color}">${g.jobs.indexOf(r) + 1}</span>${r.scheduled_time ? '<strong>' + fmtRecTime(r.scheduled_time) + '</strong> · ' : ''}${recTypeLabel(r.job_type)}: <strong>${escHtml(shortAddr(r.pickup_address))}</strong> → <strong>${escHtml(shortAddr(r.dropoff_address))}</strong>${legInfo}${warn}</div>`;
      prev = r;
    }
    sideHtml += `<div class="map-driver-card" style="border-left-color:${color}">
      <div class="map-driver-name"><span class="driver-dot" style="background:${color}"></span>${escHtml(g.driver ? g.driver.name : '⚠ Unallocated')}<span style="font-weight:400;color:var(--muted);font-size:11px;margin-left:auto">${g.jobs.length} job${g.jobs.length === 1 ? '' : 's'}</span></div>
      ${legsHtml}
    </div>`;
  }
  if (token !== recMapToken) return;
  side.innerHTML = sideHtml;
  // only auto-zoom when the date/filter/jobs actually changed — a background
  // refresh shouldn't move the map while the user is looking at it
  const fitKey = date + '|' + drvFilter + '|' + dayJobs.map(r => r.id).sort().join(',');
  if (allBounds.length && fitKey !== recMapFitKey) {
    recMapFitKey = fitKey;
    recMap.fitBounds(allBounds, { padding: [40, 40], maxZoom: 13 });
  }
}
function focusRecLeg(id) {
  const r = recJobs.find(x => x.id === id);
  if (!r || !recMap) return;
  const pts = [];
  if (r.pickup_lat != null) pts.push([r.pickup_lat, r.pickup_lng]);
  if (r.dropoff_lat != null) pts.push([r.dropoff_lat, r.dropoff_lng]);
  if (pts.length) recMap.fitBounds(pts, { padding: [60, 60], maxZoom: 13 });
}
</script>
</body>
